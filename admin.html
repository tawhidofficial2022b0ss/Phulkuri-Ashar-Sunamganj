<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Hind Siliguri",sans-serif;background:#f5f8f6;color:#173b2a}
    .wrap{width:min(1200px,94%);margin:auto}.top{background:#064f31;color:#fff;padding:18px 0}.top-in{display:flex;align-items:center;justify-content:space-between;gap:15px}
    .top h1{margin:0;font-size:25px}.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:700}.logout{background:#fff;color:#064f31}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 12px 35px #0001}
    .login-card h1{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:700}.field input{width:100%;padding:13px;border:1px solid #d4e0d8;border-radius:10px;margin-top:6px;font-size:16px}
    .primary{width:100%;background:#08733d;color:#fff}.error{color:#c62828;min-height:24px}
    #dashboard{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0000000d}.stat b{font-size:30px;display:block;color:#08733d}
    .table-wrap{background:#fff;border-radius:18px;box-shadow:0 5px 20px #0000000d;overflow:auto}.toolbar{display:flex;gap:10px;padding:16px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #d4e0d8;border-radius:10px;font:inherit}
    table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px 12px;border-top:1px solid #e7eee9;text-align:left}th{background:#f2f7f3}.name-btn{border:0;background:none;color:#08733d;font:inherit;font-weight:800;cursor:pointer;text-decoration:underline}.badge{padding:5px 9px;border-radius:15px;font-size:13px;font-weight:700}.pending{background:#fff3cd;color:#8a6500}.confirmed{background:#dff5e5;color:#08733d}.rejected{background:#fde2e2;color:#a32222}
    .modal{display:none;position:fixed;inset:0;background:#0008;padding:20px;z-index:10;overflow:auto}.modal-box{background:#fff;width:min(700px,100%);margin:30px auto;border-radius:20px;padding:25px}.modal-head{display:flex;justify-content:space-between;gap:15px}.close{font-size:25px;background:none;border:0;cursor:pointer}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.detail{background:#f6f9f7;padding:12px;border-radius:10px}.detail strong{display:block;color:#567064;font-size:13px}.detail span{display:block;margin-top:3px;word-break:break-word}.actions{margin-top:18px;display:flex;gap:10px}.confirm{background:#08733d;color:#fff}.reject{background:#b42318;color:#fff}
    @media(max-width:700px){.stats{grid-template-columns:1fr}.details{grid-template-columns:1fr}.top-in{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<section id="loginPage" class="login">
  <div class="login-card">
    <h1>🔐 Admin Login</h1>
    <p>শুধু অনুমোদিত আয়োজক এখানে রেজিস্ট্রেশন তথ্য দেখতে পারবেন।</p>
    <form id="loginForm">
      <div class="field"><label>Admin Email<input id="email" type="email" required autocomplete="username"></label></div>
      <div class="field"><label>Password<input id="password" type="password" required autocomplete="current-password"></label></div>
      <button class="btn primary" type="submit">Login</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</section>

<section id="dashboard">
  <header class="top"><div class="wrap top-in"><h1>মাইন্ড ম্যারাথন — Registration Dashboard</h1><button class="btn logout" id="logout">Logout</button></div></header>
  <main class="wrap">
    <div class="stats">
      <div class="stat"><b id="total">0</b>মোট রেজিস্ট্রেশন</div>
      <div class="stat"><b id="pending">0</b>Pending</div>
      <div class="stat"><b id="confirmed">0</b>Confirmed</div>
    </div>

    <div class="table-wrap">
      <div class="toolbar">
        <input id="search" type="search" placeholder="নাম / প্রতিষ্ঠান / ফোন দিয়ে খুঁজুন">
        <select id="statusFilter"><option value="">সব Status</option><option>Pending</option><option>Confirmed</option><option>Rejected</option></select>
      </div>
      <table>
        <thead><tr><th>#</th><th>নাম</th><th>ধরন</th><th>প্রতিযোগিতা/অনুষ্ঠান</th><th>মোবাইল</th><th>ফি</th><th>Status</th><th>তারিখ</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8">লোড হচ্ছে...</td></tr></tbody>
      </table>
    </div>
  </main>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle">অংশগ্রহণকারীর তথ্য</h2><button class="close" id="close">×</button></div>
    <div class="details" id="details"></div>
    <div class="actions">
      <button class="btn confirm" id="confirmBtn">Confirmed</button>
      <button class="btn reject" id="rejectBtn">Rejected</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const auth=firebase.auth(), db=firebase.firestore();
const loginPage=document.getElementById("loginPage"), dashboard=document.getElementById("dashboard");
const rows=document.getElementById("rows"), modal=document.getElementById("modal"), details=document.getElementById("details");
let registrations=[], selectedId=null;
auth.onAuthStateChanged(user=>{ if(user){loginPage.style.display="none";dashboard.style.display="block";loadRegistrations();}else{loginPage.style.display="grid";dashboard.style.display="none";} });
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("loginError");err.textContent="";try{await auth.signInWithEmailAndPassword(document.getElementById("email").value.trim(),document.getElementById("password").value);}catch(x){err.textContent="Login ব্যর্থ হয়েছে। Email/Password সঠিক কিনা দেখুন।";}});
document.getElementById("logout").onclick=()=>auth.signOut();
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function formatDate(ts){if(!ts)return "—";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("bn-BD")+" "+d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit"});}
function badge(s){const c=s==="Confirmed"?"confirmed":s==="Rejected"?"rejected":"pending";return `<span class="badge ${c}">${esc(s||"Pending")}</span>`;}
function typeName(t){return t==='mind-marathon'?'মাইন্ড ম্যারাথন':t==='anniversary-general'?'প্রতিষ্ঠাবার্ষিকী অনুষ্ঠান':'প্রতিযোগিতা';}
async function loadRegistrations(){try{const snap=await db.collection("registrations").orderBy("createdAt","desc").get();registrations=snap.docs.map(d=>({id:d.id,...d.data()}));render();}catch(e){rows.innerHTML=`<tr><td colspan="8">তথ্য লোড হয়নি। Firestore Rules / Admin UID যাচাই করুন।</td></tr>`;console.error(e);}}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),sf=document.getElementById("statusFilter").value;const filtered=registrations.filter(r=>{const text=[r.participantName,r.institution,r.phone,r.transactionId,(r.selectedCompetitions||[]).join(" "),typeName(r.registrationType)].join(" ").toLowerCase();return(!q||text.includes(q))&&(!sf||(r.status||"Pending")===sf);});document.getElementById("total").textContent=registrations.length;document.getElementById("pending").textContent=registrations.filter(r=>(r.status||"Pending")==="Pending").length;document.getElementById("confirmed").textContent=registrations.filter(r=>r.status==="Confirmed").length;document.getElementById("amount").textContent='৳'+registrations.reduce((sum,r)=>sum+Number(r.totalAmount||0),0).toLocaleString('bn-BD');rows.innerHTML=filtered.length?filtered.map((r,i)=>`<tr><td>${i+1}</td><td><button class="name-btn" data-id="${r.id}">${esc(r.participantName)}</button></td><td>${esc(typeName(r.registrationType))}</td><td>${esc((r.selectedCompetitions||[]).join(', '))}</td><td>${esc(r.phone)}</td><td>৳${Number(r.totalAmount||0).toLocaleString('bn-BD')}</td><td>${badge(r.status)}</td><td>${formatDate(r.createdAt)}</td></tr>`).join(""):`<tr><td colspan="8">কোনো রেজিস্ট্রেশন পাওয়া যায়নি।</td></tr>`;document.querySelectorAll('.name-btn').forEach(b=>b.onclick=()=>openDetails(b.dataset.id));}
document.getElementById("search").oninput=render;document.getElementById("statusFilter").onchange=render;
function openDetails(id){selectedId=id;const r=registrations.find(x=>x.id===id);if(!r)return;document.getElementById("modalTitle").textContent=r.participantName||"অংশগ্রহণকারী";const labels={registrationType:"রেজিস্ট্রেশন ধরন",participantName:"পূর্ণ নাম",guardianName:"পিতা/অভিভাবক",institution:"প্রতিষ্ঠান",class:"শ্রেণি",phone:"মোবাইল",email:"ই-মেইল",address:"ঠিকানা",district:"জেলা",selectedCompetitions:"নির্বাচিত প্রতিযোগিতা/অনুষ্ঠান",totalAmount:"মোট ফি",payments:"পেমেন্ট বিবরণ",note:"অতিরিক্ত তথ্য",status:"Status",createdAt:"রেজিস্ট্রেশনের সময়"};details.innerHTML=Object.entries(labels).map(([k,l])=>{let v=r[k];if(k==='registrationType')v=typeName(v);if(k==='selectedCompetitions')v=(v||[]).join(', ');if(k==='totalAmount')v='৳'+Number(v||0).toLocaleString('bn-BD');if(k==='payments')v=(v||[]).map(p=>`${p.eventName}: ৳${p.amount}, ${p.paymentMethod}, TXN: ${p.transactionId}`).join(' | ');if(k==='createdAt')v=formatDate(v);return `<div class="detail"><strong>${l}</strong><span>${esc(v||'—')}</span></div>`;}).join('');modal.style.display='block';}
document.getElementById("close").onclick=()=>modal.style.display="none";modal.onclick=e=>{if(e.target===modal)modal.style.display="none";};
async function setStatus(status){if(!selectedId)return;try{await db.collection('registrations').doc(selectedId).update({status});const r=registrations.find(x=>x.id===selectedId);if(r)r.status=status;modal.style.display='none';render();}catch(e){alert('Status পরিবর্তন করা যায়নি।');}}
document.getElementById('confirmBtn').onclick=()=>setStatus('Confirmed');document.getElementById('rejectBtn').onclick=()=>setStatus('Rejected');
</script>
</body>
</html>
