<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="ফুলকুঁড়ি আসর অনলাইন রেজিস্ট্রেশন"><title>রেজিস্ট্রেশন | ফুলকুঁড়ি আসর, Sunamganj</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
body{background:linear-gradient(135deg,#eef8e9,#fff9e8);min-height:100vh}.registration-page{padding:25px 0 60px}.registration-header{text-align:center;margin-bottom:20px}.registration-header img{width:170px;height:65px;object-fit:contain;margin:auto}.registration-card{max-width:960px;margin:auto;background:#fff;border:1px solid #e3eee6;border-radius:24px;padding:30px;box-shadow:var(--shadow)}.form-title{text-align:center;margin-bottom:25px}.form-title h1{font-size:clamp(28px,5vw,42px);line-height:1.2}.form-title p{color:var(--muted)}.selection-box{background:#f2f8ee;border-left:5px solid var(--green);padding:15px;border-radius:12px;margin-bottom:22px}.selected-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.selected-pill{background:#08733d;color:#fff;border-radius:20px;padding:6px 12px}.payment-item{border:1px solid #e1eae4;border-radius:15px;padding:16px;margin:12px 0;background:#fbfdfb}.payment-item h3{margin:0 0 8px;color:#08733d}.payment-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-status{min-height:28px;text-align:center;margin-top:12px;font-weight:700}.application-box{display:none;margin-top:20px;padding:20px;background:#f2f8ee;border-radius:16px;border:1px solid #cfe4d4}.application-actions{display:flex;gap:10px;flex-wrap:wrap}.app-btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font:inherit;font-weight:700;background:#08733d;color:#fff}.app-btn.secondary{background:#fff;color:#08733d;border:1px solid #08733d}@media(max-width:600px){.registration-card{padding:18px;border-radius:18px}.payment-row{grid-template-columns:1fr}input,select,textarea{font-size:16px!important;min-height:48px}}
</style></head>
<body><main class="registration-page"><div class="container"><div class="registration-header"><img src="assets/logo-transparent.png" alt="ফুলকুঁড়ি আসর"><div class="section-tag">📝 অনলাইন রেজিস্ট্রেশন</div></div><div class="registration-card"><div class="form-title"><h1 id="pageTitle">রেজিস্ট্রেশন</h1><p id="pageSubtitle"></p></div><div class="selection-box" id="selectionBox"></div>
<form class="registration-form" id="registrationForm" novalidate><div class="field-row"><label>অংশগ্রহণকারীর পূর্ণ নাম *<input type="text" name="participantName" required maxlength="100" placeholder="পূর্ণ নাম"></label><label>পিতা/অভিভাবকের নাম *<input type="text" name="guardianName" required maxlength="100" placeholder="পিতা/অভিভাবকের নাম"></label></div><div class="field-row"><label>শিক্ষাপ্রতিষ্ঠানের নাম *<input type="text" name="institution" required maxlength="150" placeholder="স্কুল/কলেজ"></label><label>শ্রেণি *<select name="class" required><option value="">শ্রেণি নির্বাচন করুন</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>অন্যান্য</option></select></label></div><div class="field-row"><label>মোবাইল নম্বর *<input type="tel" name="phone" required inputmode="numeric" maxlength="14" placeholder="০১XXXXXXXXX"></label><label>ই-মেইল (ঐচ্ছিক)<input type="email" name="email" maxlength="150" placeholder="example@gmail.com"></label></div><div class="field-row"><label>ঠিকানা *<input type="text" name="address" required maxlength="200" placeholder="ঠিকানা"></label><label>জেলা *<input type="text" name="district" required value="সুনামগঞ্জ" maxlength="80"></label></div><div id="payments"></div><label>অতিরিক্ত তথ্য (ঐচ্ছিক)<textarea name="note" rows="3" maxlength="500" placeholder="প্রয়োজন হলে লিখুন"></textarea></label><label class="agree"><input type="checkbox" id="agree" required> আমি নিশ্চিত করছি যে, উপরে দেওয়া তথ্যগুলো সঠিক।</label><button class="submit-btn" type="submit" id="submitBtn">রেজিস্ট্রেশন নিশ্চিত করুন <span>→</span></button><p class="form-status" id="formStatus" role="status"></p></form>
<div class="application-box" id="applicationBox"><h3>✅ Application Copy প্রস্তুত</h3><p>আপনার রেজিস্ট্রেশনের সামগ্রিক তথ্য ও নির্বাচিত প্রতিযোগিতার নামসহ কপি প্রিন্ট/PDF হিসেবে সংরক্ষণ করুন।</p><div class="application-actions"><button class="app-btn" id="printBtn">🖨️ প্রিন্ট / PDF</button><button class="app-btn secondary" id="downloadBtn">⬇️ Application Copy ডাউনলোড</button></div></div>
</div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="events-config.js"></script><script src="registration.js"></script></body></html>
